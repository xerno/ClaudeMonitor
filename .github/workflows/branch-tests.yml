name: Branch tests

on:
  push:
    branches: ["claude/optimistic-dirac-0e6yng"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | head -1)"
      - name: Test
        run: ./test.sh
